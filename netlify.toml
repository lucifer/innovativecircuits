# Netlify build configuration for innovativecircuits.com.
# The site is plain static HTML at the repo root; the build step runs the
# items manifest generator, the partials sync, and the Tailwind compile.

[build]
  command = "npm run build"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

# Long-lived cache for static assets that change rarely.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/output.css"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# Conservative cache for HTML so CMS edits propagate quickly.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Same for the items manifest — it changes every time Ron edits the CMS.
[[headers]]
  for = "/data/items.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Block the CMS admin from being indexed.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Baseline security headers for every response.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "interest-cohort=()"
    # HSTS: 2 years + includeSubDomains. No "preload" — that's a one-way
    # commitment requiring submission to hstspreload.org and is hard to
    # roll back. Add it later if/when we're confident no subdomain ever
    # needs to be served over plain HTTP.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
